# Render blueprint - single service serving the API and the built client.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: interview-prep-kit
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_PRIVATE_ADDRESSES
        value: 'false'
